unclassified:
  slackTemplatedNotifier:
    defaultChannel: "#jenkins"
    defaultWebhookCredentialId: "slack-webhook-url"
    maxRetriesOn429: 2
    httpsOnly: true
    webhookHostAllowlist:
      - "HOOKS.slack.com"
      - "mattermost.internal"
    rules:
      - jobNamePattern: "dev/server.*"
        notifyStart: true
        notifySuccess: true
        notifyFailure: true
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: SYSTEM
              id: "slack-webhook-url"
              secret: "https://hooks.slack.com/SUPER/SECRET"
              description: "Slack incoming webhook"
